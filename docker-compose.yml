# The FHIR Camp starter kit in one stack: Aidbox, a one-shot setup that loads the packages,
# the catalog and the synthetic patients, and the starter app with the odontogram.
#
# Everything:      docker compose up --build     (app on http://localhost:5173)
# Aidbox only:     docker compose up -d aidbox   (then on the host: npm run setup, npm run app)
# Aidbox UI: http://localhost:8080  (user: admin, password: see BOX_ADMIN_PASSWORD below)
#
# License: put your free Aidbox development license into .env as BOX_LICENSE=...
# (see README, "Getting started"). Without it, Aidbox asks you to activate a
# license in the browser on first start.

volumes:
  postgres_data: {}

services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker:delegated
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: aidbox
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aidbox
      POSTGRES_PASSWORD: aidbox-hackathon
    mem_limit: 1g

  aidbox:
    # Latest stable Aidbox release at the time of writing (November 2026).
    image: docker.io/healthsamurai/aidboxone:2610
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      # AIDBOX_PORT controls the host port; container clients keep using aidbox:8080.
      - "${AIDBOX_PORT:-8080}:8080"
    mem_limit: 3g
    # BOX_LICENSE comes from .env when you set it there. Without it, Aidbox asks you to activate
    # it in the browser. Do not pass an empty BOX_LICENSE: Aidbox then refuses to start.
    env_file:
      - path: .env
        required: false
    environment:
      # Local, throw-away credentials. Do not reuse them anywhere else.
      BOX_ADMIN_PASSWORD: hackathon
      BOX_ROOT_CLIENT_SECRET: hackathon
      BOX_BOOTSTRAP_FHIR_PACKAGES: hl7.fhir.r4.core#4.0.1
      BOX_DB_DATABASE: aidbox
      BOX_DB_HOST: postgres
      BOX_DB_PASSWORD: aidbox-hackathon
      BOX_DB_PORT: "5432"
      BOX_DB_USER: aidbox
      BOX_COMPATIBILITY_VALIDATION_JSON__SCHEMA_REGEX: "#{:fhir-datetime}"
      BOX_FHIR_BUNDLE_EXECUTION_VALIDATION_MODE: limited
      BOX_FHIR_COMPLIANT_MODE: "true"
      BOX_FHIR_CORRECT_AIDBOX_FORMAT: "true"
      BOX_FHIR_CREATEDAT_URL: https://aidbox.app/ex/createdAt
      BOX_FHIR_SCHEMA_VALIDATION: "true"
      BOX_FHIR_SEARCH_AUTHORIZE_INLINE_REQUESTS: "true"
      BOX_FHIR_SEARCH_CHAIN_SUBSELECT: "true"
      BOX_FHIR_SEARCH_COMPARISONS: "true"
      BOX_FHIR_TERMINOLOGY_ENGINE: hybrid
      BOX_FHIR_TERMINOLOGY_ENGINE_HYBRID_EXTERNAL_TX_SERVER: https://tx5.health-samurai.io/fhir
      BOX_FHIR_TERMINOLOGY_SERVICE_BASE_URL: https://tx5.health-samurai.io/fhir
      BOX_SEARCH_INCLUDE_CONFORMANT: "true"
      BOX_SECURITY_DEV_MODE: "true"
      BOX_SETTINGS_MODE: read-write
      BOX_WEB_BASE_URL: http://${AIDBOX_HOST:-localhost}:${AIDBOX_PORT:-8080}
      BOX_WEB_PORT: 8080
    healthcheck:
      test: curl -f http://localhost:8080/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s

  # One-shot: installs the dental packages, loads catalog and patients, validates, then exits.
  # Without a licence in .env it waits until you activate Aidbox in the browser.
  setup:
    build: .
    image: fhir-camp-kit:local
    command: ["node", "scripts/setup.mjs"]
    depends_on:
      aidbox:
        condition: service_healthy
    environment:
      AIDBOX_URL: http://aidbox:8080
      AIDBOX_BROWSER_URL: http://${AIDBOX_HOST:-localhost}:${AIDBOX_PORT:-8080}
      APP_BROWSER_URL: http://localhost:${APP_PORT:-5173}
      SETUP_WAIT_FOR_ACTIVATION: "true"
    restart: "no"
    mem_limit: 512m

  # The starter app (Vite dev server). app/src is mounted, so your edits reload in the browser.
  app:
    build: .
    image: fhir-camp-kit:local
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      AIDBOX_URL: http://aidbox:8080
      AIDBOX_BROWSER_URL: http://${AIDBOX_HOST:-localhost}:${AIDBOX_PORT:-8080}
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - ./app/src:/kit/app/src
    mem_limit: 1g
